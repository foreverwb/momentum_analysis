// Flatten all nodes
function flattenNodes(nodes, result = []) {
  for (const node of nodes) {
    result.push(node);
    if (node.children && node.children.length) flattenNodes(node.children, result);
  }
  return result;
}
const ALL_NODES = flattenNodes(NODE_TREE);

// Mock trend data generator
function genTrendData(nodeId, period) {
  const pts = period === '5d' ? 25 : period === '20d' ? 100 : 315;
  const seeds = { XLK: 0, semi: 4, soft: -3, hw: -8, 'semi-mem': 9, 'semi-compute': 12, 'semi-conn': 6, 'semi-equip': 2, 'conn-optical': 7, 'conn-copper': 3, 'soft-cloud': 1, 'soft-cyber': -5 };
  const seed = seeds[nodeId] ?? 0;
  const arr = [];
  let v = 0;
  for (let i = 0; i < pts; i++) {
    v += (Math.random() - 0.46) * 0.8 + seed * 0.03;
    arr.push(+v.toFixed(2));
  }
  return arr;
}

// ─── Helpers ────────────────────────────────────────────────────────────────

function scoreClass(s) {
  if (s >= 85) return 'score-high';
  if (s >= 70) return 'score-mid';
  if (s >= 60) return 'score-low';
  return 'score-base';
}

function deltaColor(v) {
  if (v === null || v === undefined) return '#94a3b8';
  return v > 0 ? '#22c55e' : v < 0 ? '#ef4444' : '#94a3b8';
}

function fmtDelta(v, suffix = '') {
  if (v === null || v === undefined) return '--';
  return (v > 0 ? '+' : '') + v.toFixed(1) + suffix;
}

// ─── Mini Sparkline ─────────────────────────────────────────────────────────

function Sparkline({ data, color = '#3b82f6', width = 60, height = 24 }) {
  if (!data || data.length < 2) return <span style={{ display: 'inline-block', width, height }} />;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 2) - 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// ─── Trend Chart ────────────────────────────────────────────────────────────

function TrendChart({ selectedNode, period }) {
  const series = useMemo(() => {
    const colors = { node: '#3b82f6', parent: '#8b5cf6', spy: '#94a3b8' };
    const parentId = (() => {
      const nodeId = selectedNode.id;
      function findParent(nodes, id, parent = null) {
        for (const node of nodes) {
          if (node.id === id) return parent?.id ?? null;
          if (node.children?.length) {
            const found = findParent(node.children, id, node);
            if (found !== undefined) return found;
          }
        }
        return undefined;
      }
      return findParent(NODE_TREE, nodeId) ?? 'XLK';
    })();

    return [
      { label: selectedNode.proxy || selectedNode.proxyLabel || selectedNode.label, color: colors.node, data: genTrendData(selectedNode.id, period) },
      parentId && parentId !== selectedNode.id ? { label: parentId, color: colors.parent, data: genTrendData(parentId, period) } : null,
      { label: 'SPY', color: colors.spy, data: genTrendData('spy', period) },
    ].filter(Boolean);
  }, [selectedNode.id, period]);

  const W = 600, H = 200, PAD = { t: 12, r: 16, b: 28, l: 44 };
  const chartW = W - PAD.l - PAD.r;
  const chartH = H - PAD.t - PAD.b;

  const allVals = series.flatMap(s => s.data);
  const minV = Math.min(...allVals), maxV = Math.max(...allVals);
  const range = maxV - minV || 1;

  function toX(i, len) { return PAD.l + (i / (len - 1)) * chartW; }
  function toY(v) { return PAD.t + chartH - ((v - minV) / range) * chartH; }

  const pts = (data) => data.map((v, i) => `${toX(i, data.length).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');

  // Y gridlines
  const gridVals = [minV, (minV + maxV) / 2, maxV];

  const pts20d = series[0].data.length;
  // X-axis labels
  const xLabels = (() => {
    if (period === '5d') return ['5日前', '4日', '3日', '2日', '昨日', '今日'];
    if (period === '20d') return ['20日前', '15日', '10日', '5日', '今日'];
    return ['63日前', '45日', '30日', '15日', '今日'];
  })();

  return (
    <div style={{ width: '100%', overflowX: 'hidden' }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}>
        {/* Grid */}
        {gridVals.map((v, i) => (
          <g key={i}>
            <line x1={PAD.l} y1={toY(v)} x2={W - PAD.r} y2={toY(v)} stroke="#e2e8f0" strokeWidth="1" />
            <text x={PAD.l - 6} y={toY(v) + 4} textAnchor="end" fontSize="10" fill="#94a3b8">
              {v > 0 ? '+' : ''}{v.toFixed(1)}
            </text>
          </g>
        ))}
        {/* Zero line */}
        {minV < 0 && maxV > 0 && (
          <line x1={PAD.l} y1={toY(0)} x2={W - PAD.r} y2={toY(0)} stroke="#cbd5e1" strokeWidth="1" strokeDasharray="4,3" />
        )}
        {/* Series */}
        {series.map((s, i) => (
          <polyline key={i} points={pts(s.data)} fill="none" stroke={s.color} strokeWidth={i === 0 ? 2 : 1.5} strokeLinecap="round" strokeLinejoin="round" opacity={i === 0 ? 1 : 0.6} />
        ))}
        {/* X labels */}
        {xLabels.map((lbl, i) => {
          const x = PAD.l + (i / (xLabels.length - 1)) * chartW;
          return <text key={i} x={x} y={H - 6} textAnchor="middle" fontSize="10" fill="#94a3b8">{lbl}</text>;
        })}
      </svg>
      {/* Legend */}
      <div style={{ display: 'flex', gap: 16, paddingLeft: PAD.l, marginTop: 4 }}>
        {series.map((s, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
            <div style={{ width: 20, height: 2.5, borderRadius: 2, background: s.color, opacity: i === 0 ? 1 : 0.65 }} />
            <span style={{ fontSize: 11, color: '#475569' }}>{s.label}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Node Tree Item ──────────────────────────────────────────────────────────

function NodeItem({ node, selectedId, onSelect, expandedIds, onToggle }) {
  const isSelected = selectedId === node.id;
  const hasChildren = node.children && node.children.length > 0;
  const isExpanded = expandedIds.has(node.id);
  const indent = node.level * 16;
  const sparkData = useMemo(() => genTrendData(node.id, '20d').slice(-30), [node.id]);

  return (
    <div>
      <div
        onClick={() => { onSelect(node); if (hasChildren) onToggle(node.id); }}
        className="transition-all"
        style={{
          display: 'flex', alignItems: 'center', gap: 8,
          padding: '8px 12px', paddingLeft: 12 + indent,
          cursor: 'pointer', borderRadius: 8, margin: '1px 6px',
          border: isSelected ? '1px solid var(--accent-blue)' : '1px solid transparent',
          background: isSelected
            ? 'linear-gradient(135deg, rgba(37,99,235,0.07), rgba(147,51,234,0.07))'
            : 'transparent',
        }}
        onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = '#f1f5f9'; }}
        onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = 'transparent'; }}
      >
        {/* Expand toggle */}
        <span style={{ width: 14, color: '#94a3b8', flexShrink: 0 }}>
          {hasChildren
            ? (isExpanded ? <Icon.ChevronDown /> : <Icon.ChevronRight />)
            : <span style={{ display: 'inline-block', width: 14 }} />}
        </span>

        {/* Name */}
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ fontWeight: isSelected ? 700 : 500, fontSize: 13, color: isSelected ? '#1e293b' : '#334155', whiteSpace: 'nowrap' }}>
              {node.label}
            </span>
            {node.proxy && (
              <span className="proxy-tag" style={{ background: node.proxyType === 'etf' ? 'rgba(59,130,246,0.1)' : 'rgba(245,158,11,0.1)', color: node.proxyType === 'etf' ? '#2563eb' : '#d97706' }}>
                {node.proxyType === 'etf' ? node.proxy : '合成'}
              </span>
            )}
            {!node.proxy && node.proxyType === 'synthetic' && (
              <span className="proxy-tag" style={{ background: 'rgba(245,158,11,0.1)', color: '#d97706' }}>合成</span>
            )}
          </div>
          <div style={{ fontSize: 10, color: '#94a3b8', marginTop: 1, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
            {node.sublabel}
          </div>
        </div>

        {/* Score + sparkline */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
          <Sparkline data={sparkData} color={node.score >= 80 ? '#22c55e' : node.score >= 65 ? '#3b82f6' : '#f59e0b'} width={44} height={18} />
          <span className={scoreClass(node.score)} style={{ fontWeight: 700, fontSize: 13, minWidth: 28, textAlign: 'right' }}>
            {node.score.toFixed(0)}
          </span>
        </div>
      </div>

      {/* Children */}
      {hasChildren && isExpanded && (
        <div>
          {node.children.map(child => (
            <NodeItem key={child.id} node={child} selectedId={selectedId} onSelect={onSelect} expandedIds={expandedIds} onToggle={onToggle} />
          ))}
        </div>
      )}
    </div>
  );
}

  if (!node) return null;

    // find parent's children as siblings
    function findSiblings(nodes, targetId) {
      for (const n of nodes) {
        if (n.children?.some(c => c.id === targetId)) return n.children;
        if (n.children?.length) {
          const found = findSiblings(n.children, targetId);
          if (found) return found;
        }

    return findSiblings(NODE_TREE, node.id) || [];

        </div>
      )}
    </div>
  );
}

  { id: 'XLK',          cx: 380, cy: 44,  w: 122, h: 46, role: 'sector' },
  { id: 'semi',         cx: 150, cy: 132, w: 110, h: 44, role: 'upstream' },
  { id: 'soft',         cx: 385, cy: 132, w: 100, h: 44, role: 'platform' },
  { id: 'hw',           cx: 614, cy: 132, w: 104, h: 44, role: 'upstream' },
  { id: 'semi-equip',   cx: 44,  cy: 218, w: 88,  h: 40, role: 'upstream' },
  { id: 'semi-compute', cx: 146, cy: 218, w: 88,  h: 40, role: 'compute' },
  { id: 'semi-mem',     cx: 248, cy: 218, w: 88,  h: 40, role: 'memory' },
  { id: 'semi-conn',    cx: 350, cy: 218, w: 88,  h: 40, role: 'interconnect' },
  { id: 'soft-cloud',   cx: 466, cy: 218, w: 94,  h: 40, role: 'platform' },
  { id: 'soft-cyber',   cx: 572, cy: 218, w: 94,  h: 40, role: 'application' },
  { id: 'conn-optical', cx: 296, cy: 304, w: 102, h: 40, role: 'leaf' },
  { id: 'conn-copper',  cx: 410, cy: 304, w: 92,  h: 40, role: 'leaf' },
];

const CN_EDGES = [
  { from: 'XLK',       to: 'semi' },
  { from: 'XLK',       to: 'soft' },
  { from: 'XLK',       to: 'hw' },
  { from: 'semi',      to: 'semi-equip' },
  { from: 'semi',      to: 'semi-compute' },
  { from: 'semi',      to: 'semi-mem' },
  { from: 'semi',      to: 'semi-conn' },
  { from: 'soft',      to: 'soft-cloud' },
  { from: 'soft',      to: 'soft-cyber' },
  { from: 'semi-conn', to: 'conn-optical' },
  { from: 'semi-conn', to: 'conn-copper' },
  { from: 'hw',        to: 'semi-conn', cross: true },
];

const CN_ROLE_COLORS = {
  sector: '#1e293b', upstream: '#8b5cf6', compute: '#2563eb', memory: '#3b82f6',
  interconnect: '#f59e0b', platform: '#22c55e', application: '#10b981', leaf: '#94a3b8',
};

function scoreTierStyle(score) {
  if (score >= 85) return { border: '#059669', bg: 'rgba(5,150,105,0.07)',   text: '#059669' };
  if (score >= 70) return { border: '#3b82f6', bg: 'rgba(59,130,246,0.07)', text: '#2563eb' };
  if (score >= 60) return { border: '#d97706', bg: 'rgba(217,119,6,0.07)',   text: '#d97706' };
  return              { border: '#cbd5e1', bg: 'rgba(148,163,184,0.05)', text: '#64748b' };
}

// ── Strategic Panel (right side of ChainView) ───────────────────────────────────

function StrategicPanel({ selectedNode, onSelect, period }) {
  const sm = useMemo(() => {
    const m = {};
    ALL_NODES.forEach(n => { m[n.id] = n; });
    return m;
  }, []);

  const l1Ranking = useMemo(() =>
    [sm['semi'], sm['soft'], sm['hw']].filter(Boolean).sort((a,b) => b.score - a.score),
  [sm]);

  const topL1 = l1Ranking[0];
  const topL1Children = topL1?.children || [];
  const strongChildren = topL1Children.filter(c => (sm[c.id]?.score ?? c.score) > 75);
  const breadthLabel = strongChildren.length >= 3 ? '全面扩散' : strongChildren.length === 2 ? '主线驱动' : '单点拉动';
  const breadthColor = strongChildren.length >= 3 ? '#059669' : strongChildren.length === 2 ? '#2563eb' : '#d97706';

  const equipScore   = sm['semi-equip']?.score ?? 0;
  const connScore    = sm['semi-conn']?.score ?? 0;
  const computeScore = sm['semi-compute']?.score ?? 0;
  const computeLeading = computeScore > equipScore && computeScore > connScore;

  const l2Nodes = ['semi-equip','semi-compute','semi-mem','semi-conn','soft-cloud','soft-cyber'].map(id => sm[id]).filter(Boolean);
  const bestDrill = l2Nodes.reduce((best, n) => (!best || (n.delta5d ?? -99) > (best.delta5d ?? -99)) ? n : best, null);

  const QBadge = ({ n }) => (
    <span style={{ background: '#f1f5f9', color: '#475569', width: 18, height: 18, borderRadius: 5,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700, flexShrink: 0 }}>Q{n}</span>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {/* Header */}
      <div style={{ padding: '12px 16px', background: 'linear-gradient(135deg,#f8fafc,#eff6ff)', borderRadius: 14, border: '1px solid #e2e8f0' }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b', marginBottom: 3 }}>下钔策略分析</div>
        <div style={{ fontSize: 11, color: '#64748b' }}>基于 {topL1?.label ?? '--'} 当前动能结构自动计算</div>
      </div>

      {/* Q1: L1 ranking */}
      <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 14, padding: '12px 14px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
          <QBadge n={1} /> 一级节点谁最强？
        </div>
        {l1Ranking.map((node, i) => {
          const tier = scoreTierStyle(node.score);
          return (
            <div key={node.id} onClick={() => onSelect(node)}
              style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: i < l1Ranking.length-1 ? 8 : 0, cursor: 'pointer' }}>
              <span style={{ fontSize: 11, color: '#94a3b8', width: 16, fontWeight: 700 }}>#{i+1}</span>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: '#1e293b' }}>{node.label}</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: tier.text }}>{node.score.toFixed(1)}</span>
                </div>
                <div style={{ height: 4, background: '#f1f5f9', borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: `${node.score}%`, background: tier.border, borderRadius: 2, transition: 'width 0.5s ease' }} />
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Q2: breadth */}
      <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 14, padding: '12px 14px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
          <QBadge n={2} /> {topL1?.label} 内部广还是窄？
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
          <span style={{ fontSize: 16, fontWeight: 800, color: breadthColor }}>{breadthLabel}</span>
          <span style={{ fontSize: 11, color: '#64748b' }}>{strongChildren.length}/{topL1Children.length} 个子节点 &gt;75分</span>
        </div>
        <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap' }}>
          {topL1Children.map(c => {
            const cn = sm[c.id] || c;
            const strong = cn.score > 75;
            return (
              <div key={c.id} onClick={() => onSelect(cn)}
                style={{ padding: '3px 9px', borderRadius: 20, fontSize: 11, cursor: 'pointer',
                  background: strong ? 'rgba(5,150,105,0.08)' : 'rgba(148,163,184,0.08)',
                  border: `1px solid ${strong ? 'rgba(5,150,105,0.25)' : '#e2e8f0'}`,
                  color: strong ? '#059669' : '#94a3b8', fontWeight: 500 }}>
                {cn.label} <span style={{ fontWeight: 700 }}>{cn.score.toFixed(0)}</span>
              </div>
            );
          })}
        </div>
      </div>

      {/* Q3: upstream/downstream */}
      <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 14, padding: '12px 14px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
          <QBadge n={3} /> 上下游是否开始确认？
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {[
            { label: '上游设备', score: equipScore, ok: equipScore > 70 },
            { label: '高速互联', score: connScore,  ok: connScore > 70 },
          ].map(item => (
            <div key={item.label} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 66, display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0 }}>
                <span style={{ fontSize: 11, color: item.ok ? '#059669' : '#d97706', fontWeight: 700 }}>{item.ok ? '✓' : '○'}</span>
                <span style={{ fontSize: 11, color: '#475569' }}>{item.label}</span>
              </div>
              <div style={{ flex: 1, height: 4, background: '#f1f5f9', borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${item.score}%`, background: item.ok ? '#22c55e' : '#f59e0b', borderRadius: 2 }} />
              </div>
              <span style={{ fontSize: 11, fontWeight: 700, color: item.ok ? '#059669' : '#d97706', minWidth: 24, textAlign: 'right', flexShrink: 0 }}>{item.score.toFixed(0)}</span>
            </div>
          ))}
          <div style={{ marginTop: 2, padding: '7px 10px', borderRadius: 8, fontSize: 11, lineHeight: 1.5,
            background: computeLeading ? 'rgba(37,99,235,0.06)' : 'rgba(5,150,105,0.06)',
            color: computeLeading ? '#2563eb' : '#059669', border: `1px solid ${computeLeading ? 'rgba(59,130,246,0.15)' : 'rgba(5,150,105,0.15)'}` }}>
            {computeLeading
              ? '⚡ 算力领涨，设备 / 连接尚在跟进中，属主线扩散中段'
              : '✔️ 上下游联动信号已出现，全链景气提升中'}
          </div>
        </div>
      </div>

      {/* Q4: drill recommendation */}
      <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 14, padding: '12px 14px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8', marginBottom: 10, display: 'flex', alignItems: 'center', gap: 6 }}>
          <QBadge n={4} /> 建议下钔方向？
        </div>
        {bestDrill && (
          <div onClick={() => onSelect(bestDrill)}
            style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px',
              borderRadius: 10, background: 'rgba(37,99,235,0.05)', border: '1px solid rgba(59,130,246,0.2)' }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b' }}>{bestDrill.label}</div>
              <div style={{ fontSize: 10, color: '#64748b', marginTop: 2 }}>{bestDrill.sublabel}</div>
            </div>
            <div style={{ textAlign: 'right', flexShrink: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#22c55e' }}>5D {bestDrill.delta5d > 0 ? '+' : ''}{bestDrill.delta5d?.toFixed(1)}</div>
              <div style={{ fontSize: 10, color: '#94a3b8', marginTop: 1 }}>动能最强</div>
            </div>
            <span style={{ color: '#3b82f6', fontSize: 16, marginLeft: 4 }}>→</span>
          </div>
        )}
      </div>

      {/* Selected node quick detail */}
      {selectedNode && (
        <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 14, padding: '12px 14px' }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: '#94a3b8', marginBottom: 10 }}>当前选中节点</div>
          <NodeDetailPanel node={selectedNode} period={period} />
        </div>
      )}
    </div>
  );
}

// ── Chain Graph Canvas (SVG) + full-body ChainView ───────────────────────────────

function ChainView({ selectedNode, onSelect, onBackToGics, period, setPeriod }) {
  const [hoverId, setHoverId] = useState(null);
  const scoreMap = useMemo(() => {
    const m = {};
    ALL_NODES.forEach(n => { m[n.id] = n; });
    return m;
  }, []);
  const nodeMap = useMemo(() => {
    const m = {};
    CN_NODES.forEach(n => { m[n.id] = n; });
    return m;
  }, []);

  const sig = useMemo(() => {
    const s = id => scoreMap[id]?.score ?? 0;
    const upstreamOk   = s('semi-equip') > 70;
    const broadOk      = ['semi-equip','semi-compute','semi-mem','semi-conn'].filter(id => s(id) > 75).length >= 3;
    const downstreamOk = s('conn-optical') > 75 || s('conn-copper') > 75;
    const n = [upstreamOk, broadOk, downstreamOk].filter(Boolean).length;
    return {
      upstream: upstreamOk, broad: broadOk, downstream: downstreamOk,
      label: ['链条断裂','单点拉动','主线扩散','全链共振'][n],
      color: ['#dc2626','#d97706','#2563eb','#059669'][n],
    };
  }, [scoreMap]);

  const VW = 760, VH = 350;

  return (
    <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>

      {/* ── LEFT: Graph ── */}
      <div style={{ flex: 3, display: 'flex', flexDirection: 'column', borderRight: '1px solid #e2e8f0', overflow: 'hidden', minWidth: 0 }}>

        {/* Toolbar */}
        <div style={{ padding: '10px 18px', borderBottom: '1px solid #e2e8f0', background: '#fff', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
          <button onClick={onBackToGics} style={{
            display: 'flex', alignItems: 'center', gap: 5, padding: '5px 10px', borderRadius: 6,
            border: '1px solid #e2e8f0', background: '#f8fafc', fontSize: 11, color: '#475569',
            cursor: 'pointer', fontFamily: 'inherit', fontWeight: 500,
          }}>← GICS 分类视图</button>

          <div style={{ width: 1, height: 16, background: '#e2e8f0' }} />
          <span style={{ fontSize: 13, fontWeight: 700, color: '#1e293b' }}>XLK 产业链图</span>
          <span style={{ fontSize: 11, color: '#94a3b8' }}>点击节点查看详情分析</span>

          {/* Signal badges */}
          <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6 }}>
            {[
              { label: '上游共振', ok: sig.upstream },
              { label: '同层扩散', ok: sig.broad },
              { label: '下游确认', ok: sig.downstream },
            ].map(s => (
              <div key={s.label} style={{
                display: 'flex', alignItems: 'center', gap: 4, padding: '4px 10px', borderRadius: 20,
                background: s.ok ? 'rgba(34,197,94,0.08)' : 'rgba(245,158,11,0.07)',
                border: `1px solid ${s.ok ? 'rgba(34,197,94,0.22)' : 'rgba(245,158,11,0.22)'}`,
              }}>
                <span style={{ fontSize: 11, color: s.ok ? '#059669' : '#d97706', fontWeight: 700 }}>{s.ok ? '✓' : '○'}</span>
                <span style={{ fontSize: 11, color: s.ok ? '#059669' : '#d97706', fontWeight: 500 }}>{s.label}</span>
              </div>
            ))}
            <div style={{
              padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 700,
              color: sig.color, background: `${sig.color}18`, border: `1px solid ${sig.color}40`,
            }}>{sig.label}</div>
          </div>
        </div>

        {/* SVG Graph */}
        <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column', background: '#fafbfc' }}>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', flex: 1, display: 'block' }} preserveAspectRatio="xMidYMid meet">

            {/* Tier bands */}
            {[
              { y: 0,   h: 88,  label: '板块层 L0' },
              { y: 88,  h: 88,  label: '主题层 L1' },
              { y: 176, h: 88,  label: '细分层 L2' },
              { y: 264, h: 86,  label: '叶子层 L3' },
            ].map((t, i) => (
              <g key={i}>
                <rect x={0} y={t.y} width={VW} height={t.h} fill={i % 2 === 0 ? '#f8fafc' : '#f1f5f9'} />
                <text x={8} y={t.y+15} fontSize={9} fill="#d1d5db" fontFamily="Inter, sans-serif">{t.label}</text>
              </g>
            ))}

            {/* Edges */}
            {CN_EDGES.map((edge, i) => {
              const src = nodeMap[edge.from], tgt = nodeMap[edge.to];
              if (!src || !tgt) return null;
              const x1 = src.cx, y1 = src.cy + src.h/2;
              const x2 = tgt.cx, y2 = tgt.cy - tgt.h/2;
              const cmy = (y1 + y2) / 2;
              const srcScore = scoreMap[edge.from]?.score ?? 0;
              const tgtScore = scoreMap[edge.to]?.score ?? 0;
              const strong = srcScore > 75 && tgtScore > 75 && !edge.cross;
              return (
                <path key={i}
                  d={`M ${x1} ${y1} C ${x1} ${cmy}, ${x2} ${cmy}, ${x2} ${y2}`}
                  fill="none"
                  stroke={edge.cross ? '#f59e0b' : strong ? '#93c5fd' : '#dde5f0'}
                  strokeWidth={strong ? 2.5 : 1.5}
                  strokeDasharray={edge.cross ? '5,3' : 'none'}
                  opacity={edge.cross ? 0.75 : 1}
                />
              );
            })}

            {/* Nodes */}
            {CN_NODES.map(cn => {
              const node = scoreMap[cn.id];
              if (!node) return null;
              const isSelected = cn.id === selectedNode?.id;
              const isHovered  = cn.id === hoverId;
              const tier = scoreTierStyle(node.score);
              const roleColor = CN_ROLE_COLORS[cn.role] || '#94a3b8';
              const x0 = cn.cx - cn.w/2, y0 = cn.cy - cn.h/2;
              const proxyStr = node.proxy || (node.proxyType === 'synthetic' ? '合成篹' : '');

              return (
                <g key={cn.id} style={{ cursor: 'pointer' }}
                  onClick={() => onSelect(node)}
                  onMouseEnter={() => setHoverId(cn.id)}
                  onMouseLeave={() => setHoverId(null)}
                >
                  {(isSelected || isHovered) && (
                    <rect x={x0-2} y={y0-2} width={cn.w+4} height={cn.h+4} rx={9}
                      fill="none"
                      stroke={isSelected ? '#3b82f6' : '#cbd5e1'}
                      strokeWidth={isSelected ? 2 : 1.5} opacity={0.7}
                    />
                  )}
                  <rect x={x0} y={y0} width={cn.w} height={cn.h} rx={7}
                    fill={isSelected ? '#eff6ff' : tier.bg}
                    stroke={isSelected ? '#3b82f6' : isHovered ? '#94a3b8' : tier.border}
                    strokeWidth={isSelected ? 1.5 : 1}
                  />
                  {/* Role stripe */}
                  <rect x={x0} y={y0+6} width={3} height={cn.h-12} rx={1.5} fill={roleColor} />
                  {/* Label */}
                  <text x={x0+11} y={cn.cy-(cn.h>40?7:5)}
                    fontSize={cn.id==='XLK' ? 13 : 11} fontWeight="700"
                    fill={isSelected ? '#1e293b' : '#334155'}
                    fontFamily="Noto Sans SC, Inter, sans-serif">
                    {node.label}
                  </text>
                  {/* Score */}
                  <text x={x0+cn.w-8} y={cn.cy-(cn.h>40?7:5)}
                    fontSize={cn.id==='XLK' ? 13 : 11} fontWeight="700"
                    fill={tier.text} textAnchor="end"
                    fontFamily="Inter, sans-serif">
                    {node.score.toFixed(0)}
                  </text>
                  {/* Proxy */}
                  <text x={x0+11} y={y0+cn.h-7}
                    fontSize={8} fill="#94a3b8"
                    fontFamily="Inter, sans-serif">
                    {proxyStr}
                  </text>
                  {/* Delta5d */}
                  {node.delta5d !== null && (
                    <text x={x0+cn.w-8} y={y0+cn.h-7}
                      fontSize={8} textAnchor="end"
                      fill={node.delta5d >= 0 ? '#22c55e' : '#ef4444'}
                      fontFamily="Inter, sans-serif">
                      {node.delta5d > 0 ? '+' : ''}{node.delta5d?.toFixed(1)}
                    </text>
                  )}
                </g>
              );
            })}

            {/* Cross-link label near HW→semi-conn edge */}
            <text x={490} y={172} fontSize={8} fill="#f59e0b" fontFamily="Noto Sans SC, sans-serif" opacity={0.85}>跨链</text>
          </svg>

          {/* Bottom legend */}
          <div style={{ padding: '9px 18px', borderTop: '1px solid #e2e8f0', background: '#fff', display: 'flex', alignItems: 'center', gap: 14, flexShrink: 0 }}>
            <span style={{ fontSize: 10, fontWeight: 600, color: '#94a3b8' }}>链条角色</span>
            {[['上游','#8b5cf6'],['算力','#2563eb'],['存储','#3b82f6'],['互联','#f59e0b'],['平台','#22c55e'],['应用','#10b981']].map(([label, color]) => (
              <div key={label} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 7, height: 7, borderRadius: 2, background: color }} />
                <span style={{ fontSize: 10, color: '#64748b' }}>{label}</span>
              </div>
            ))}
            <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4,3"/></svg>
                <span style={{ fontSize: 10, color: '#94a3b8' }}>跨链关联</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                <svg width="22" height="6"><line x1="0" y1="3" x2="22" y2="3" stroke="#93c5fd" strokeWidth="2.5"/></svg>
                <span style={{ fontSize: 10, color: '#94a3b8' }}>强关联边</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ── RIGHT: Strategic analysis ── */}
      <div style={{ width: 380, flexShrink: 0, overflowY: 'auto', background: '#f8fafc', padding: '14px' }}>
        <StrategicPanel selectedNode={selectedNode} onSelect={onSelect} period={period} />
      </div>
    </div>
  );
}

const STATUS_CFG = {
  complete: { label: '已更新', bg: 'rgba(34,197,94,0.1)',  color: '#16a34a' },
  pending:  { label: '待计算', bg: 'rgba(245,158,11,0.1)', color: '#d97706' },
  missing:  { label: '缺失',   bg: 'rgba(239,68,68,0.1)',  color: '#dc2626' },
};

function StockHoldingsTable({ nodeId, compact = false }) {
  const holdings = NODE_HOLDINGS[nodeId] || [];
  const [sortKey, setSortKey] = useState('score');
  const [sortAsc, setSortAsc] = useState(false);
  const [showAll, setShowAll] = useState(false);

  const sorted = useMemo(() => {
    return [...holdings].sort((a, b) => {
      const va = a[sortKey], vb = b[sortKey];
      return sortAsc ? va - vb : vb - va;
    });
  }, [holdings, sortKey, sortAsc]);

  const displayed = showAll || compact ? sorted : sorted.slice(0, 8);
  const handleSort = (key) => {
    if (sortKey === key) setSortAsc(a => !a);
    else { setSortKey(key); setSortAsc(false); }
  };

  const SortArrow = ({ k }) => (
    <span style={{ marginLeft: 2, opacity: sortKey === k ? 1 : 0.3, fontSize: 9 }}>
      {sortKey === k && sortAsc ? '▲' : '▼'}
    </span>
  );

  if (holdings.length === 0) return (
    <div style={{ padding: '16px', textAlign: 'center', color: '#94a3b8', fontSize: 12 }}>暂无持仓数据</div>
  );

  if (compact) {
    // Compact version for right panel — top 5 only
    return (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
        {sorted.slice(0, 5).map((h, i) => (
          <div key={h.ticker} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 8px', borderRadius: 8, background: '#f8fafc' }}>
            <span style={{ fontSize: 10, color: '#94a3b8', minWidth: 14, textAlign: 'center' }}>#{i+1}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: '#1e293b' }}>{h.ticker}</div>
              <div style={{ fontSize: 10, color: '#94a3b8', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.name}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div className={scoreClass(h.score)} style={{ fontSize: 13, fontWeight: 700 }}>{h.score.toFixed(0)}</div>
              <div style={{ fontSize: 10, color: deltaColor(h.return20d) }}>{h.return20d > 0 ? '+' : ''}{h.return20d.toFixed(1)}%</div>
            </div>
            <div style={{ width: 36, textAlign: 'right' }}>
              <div style={{ fontSize: 10, color: '#94a3b8' }}>{h.weight.toFixed(1)}%</div>
              <div style={{ fontSize: 10, color: STATUS_CFG[h.status]?.color }}>{STATUS_CFG[h.status]?.label}</div>
            </div>
          </div>
        ))}
        {sorted.length > 5 && (
          <div style={{ fontSize: 11, color: '#94a3b8', textAlign: 'center', paddingTop: 4 }}>
            +{sorted.length - 5} 只标的
          </div>
        )}
      </div>
    );
  }

  // Full table version for center panel
  const colStyle = { fontSize: 11, color: '#64748b', cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap' };
  const cellStyle = { fontSize: 12, color: '#1e293b' };
  const numCell = { fontSize: 12, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };

  return (
    <div>
      {/* Table */}
      <div style={{ overflowX: 'auto' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid #f1f5f9' }}>
              <th style={{ ...colStyle, padding: '6px 8px', textAlign: 'left', fontWeight: 600, width: 28 }}>#</th>
              <th style={{ ...colStyle, padding: '6px 8px', textAlign: 'left', fontWeight: 600 }}>标的</th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('weight')}>权重<SortArrow k="weight" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('score')}>动能分<SortArrow k="score" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('return20d')}>20D收益<SortArrow k="return20d" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('rs20d')}>RS节点<SortArrow k="rs20d" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('delta3d')}>3D Δ<SortArrow k="delta3d" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'right', fontWeight: 600 }} onClick={() => handleSort('delta5d')}>5D Δ<SortArrow k="delta5d" /></th>
              <th style={{ ...colStyle, padding: '6px 12px', textAlign: 'center', fontWeight: 600 }}>状态</th>
            </tr>
          </thead>
          <tbody>
            {displayed.map((h, i) => {
              const sc = STATUS_CFG[h.status] || STATUS_CFG.missing;
              return (
                <tr key={h.ticker} style={{ borderBottom: '1px solid #f8fafc' }}
                  onMouseEnter={e => e.currentTarget.style.background = '#f8fafc'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                >
                  <td style={{ padding: '7px 8px', fontSize: 11, color: '#94a3b8', textAlign: 'center' }}>{i+1}</td>
                  <td style={{ padding: '7px 8px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      {/* Mini score bar */}
                      <div style={{ width: 3, height: 28, borderRadius: 2, background: h.score >= 85 ? '#059669' : h.score >= 70 ? '#2563eb' : h.score >= 60 ? '#d97706' : '#94a3b8', flexShrink: 0 }} />
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b', letterSpacing: '0.01em' }}>{h.ticker}</div>
                        <div style={{ fontSize: 10, color: '#94a3b8', maxWidth: 140, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.name}</div>
                      </div>
                    </div>
                  </td>
                  <td style={{ ...numCell, padding: '7px 12px', color: '#475569' }}>{h.weight.toFixed(1)}%</td>
                  <td style={{ ...numCell, padding: '7px 12px' }}>
                    <span className={scoreClass(h.score)} style={{ fontWeight: 700 }}>{h.score.toFixed(1)}</span>
                  </td>
                  <td style={{ ...numCell, padding: '7px 12px', color: deltaColor(h.return20d), fontWeight: 600 }}>
                    {h.return20d > 0 ? '+' : ''}{h.return20d.toFixed(1)}%
                  </td>
                  <td style={{ ...numCell, padding: '7px 12px', color: deltaColor(h.rs20d), fontWeight: 600 }}>
                    {h.rs20d > 0 ? '+' : ''}{h.rs20d.toFixed(1)}%
                  </td>
                  <td style={{ ...numCell, padding: '7px 12px', color: deltaColor(h.delta3d), fontWeight: 500 }}>
                    {h.delta3d > 0 ? '+' : ''}{h.delta3d.toFixed(1)}
                  </td>
                  <td style={{ ...numCell, padding: '7px 12px', color: deltaColor(h.delta5d), fontWeight: 500 }}>
                    {h.delta5d > 0 ? '+' : ''}{h.delta5d.toFixed(1)}
                  </td>
                  <td style={{ padding: '7px 12px', textAlign: 'center' }}>
                    <span style={{ fontSize: 10, padding: '2px 7px', borderRadius: 5, background: sc.bg, color: sc.color, fontWeight: 500, whiteSpace: 'nowrap' }}>
                      {sc.label}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Show more */}
      {!showAll && holdings.length > 8 && (
        <div style={{ paddingTop: 10, textAlign: 'center' }}>
          <button onClick={() => setShowAll(true)} style={{
            fontSize: 12, color: '#2563eb', background: 'none', border: '1px solid #e2e8f0',
            borderRadius: 6, padding: '5px 16px', cursor: 'pointer', fontFamily: 'inherit',
          }}>
            展开全部 ({holdings.length - 8} 更多)
          </button>
        </div>
      )}
    </div>
  );
}

                      onClick={() => handleSelect(child)}
                      style={{
                        background: '#f8fafc', borderRadius: 12, padding: '12px 14px',
                        border: '1px solid #e2e8f0', cursor: 'pointer',
                        transition: 'all 0.15s ease',
                      }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = '#3b82f6'; e.currentTarget.style.background = 'rgba(59,130,246,0.03)'; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = '#e2e8f0'; e.currentTarget.style.background = '#f8fafc'; }}
                    >
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b' }}>{child.label}</div>
                          <div style={{ fontSize: 10, color: '#94a3b8', marginTop: 1 }}>
                            {child.proxyType === 'etf' ? child.proxy : '合成'}
                          </div>
                        </div>
                        <span className={scoreClass(child.score)} style={{ fontSize: 20, fontWeight: 700, lineHeight: 1 }}>
                          {child.score.toFixed(0)}
                        </span>
                      </div>
                      <Sparkline data={genTrendData(child.id, '20d').slice(-40)} color={child.score >= 80 ? '#22c55e' : child.score >= 65 ? '#3b82f6' : '#f59e0b'} width={220} height={28} />
                      <div style={{ marginTop: 7, borderTop: '1px solid #f1f5f9', paddingTop: 7 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                          <span style={{ fontSize: 10, color: '#94a3b8' }}>对母板块贡献</span>
                          <span style={{ fontSize: 11, fontWeight: 700, color: '#2563eb' }}>{child.contribution}%</span>
                        </div>
                        <ContribBar value={child.contribution} max={100} color="#3b82f6" />
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 7 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                          <span style={{ fontSize: 10, color: '#94a3b8' }}>vs母</span>
                          <span style={{ fontSize: 11, color: deltaColor(child.scoreVsParent), fontWeight: 600 }}>{child.scoreVsParent !== null ? fmtDelta(child.scoreVsParent, '') : '--'}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                          <span style={{ fontSize: 10, color: '#94a3b8' }}>5D</span>
                          <span style={{ fontSize: 11, color: deltaColor(child.delta5d), fontWeight: 600 }}>{fmtDelta(child.delta5d, '')}</span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                          <span style={{ fontSize: 10, color: '#94a3b8' }}>广度</span>
                          <span style={{ fontSize: 11, color: child.breadth >= 70 ? '#059669' : child.breadth >= 50 ? '#2563eb' : '#d97706', fontWeight: 600 }}>{child.breadth}%</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Holdings table */}
            <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 16, padding: '16px 20px' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b' }}>持仓标的</div>
                  <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 2 }}>
                    {selectedNode.proxyType === 'etf' ? `${selectedNode.proxy} 成分股` : `合成篮成分股 · ${selectedNode.proxyLabel || ''}`}
                    　·　共 {(NODE_HOLDINGS[selectedNode.id] || []).length} 只
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8, fontSize: 11 }}>
                  {['complete','pending','missing'].map(s => {
                    const cfg = STATUS_CFG[s];
                    const cnt = (NODE_HOLDINGS[selectedNode.id] || []).filter(h => h.status === s).length;
                    if (!cnt) return null;
                    return <span key={s} style={{ padding:'2px 8px', borderRadius:5, background:cfg.bg, color:cfg.color, fontWeight:500 }}>{cfg.label} {cnt}</span>;
                  })}
                </div>
              </div>
              <StockHoldingsTable nodeId={selectedNode.id} />
            </div>

            {/* Data source status bar */}
            <div style={{ background: '#fff', border: '1px solid #e2e8f0', borderRadius: 12, padding: '12px 18px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <span style={{ fontSize: 12, fontWeight: 600, color: '#475569' }}>数据来源状态</span>
                {[
                  { label: 'Finviz', color: '#93c5fd', status: '已更新', ok: true },
                  { label: 'MarketChameleon', color: '#86efac', status: '已更新', ok: true },
                  { label: 'IBKR 市场数据', color: '#fca5a5', status: '待更新', ok: false },
                  { label: 'Futu 期权数据', color: '#fb923c', status: '已更新', ok: true },
                ].map(src => (
                  <div key={src.label} style={{ display: 'flex', alignItems: 'center', gap: 5, padding: '3px 9px', borderRadius: 20, background: src.ok ? 'rgba(34,197,94,0.07)' : 'rgba(245,158,11,0.07)', border: `1px solid ${src.ok ? 'rgba(34,197,94,0.2)' : 'rgba(245,158,11,0.25)'}` }}>
                    <div style={{ width: 6, height: 6, borderRadius: '50%', background: src.ok ? '#22c55e' : '#f59e0b', flexShrink: 0 }} />
                    <span style={{ fontSize: 11, color: '#475569' }}>{src.label}</span>
                    <span style={{ fontSize: 11, color: src.ok ? '#059669' : '#d97706', fontWeight: 600 }}>{src.status}</span>
                  </div>
                ))}
                <span style={{ marginLeft: 'auto', fontSize: 10, color: '#94a3b8', flexShrink: 0 }}>北京时间 09:32</span>
              </div>
            </div>
          </div>
        </div>

        {/* ── RIGHT: Node Detail Panel ── */}
        <div style={{
          width: 300, flexShrink: 0, borderLeft: '1px solid #e2e8f0',
          background: '#f8fafc', display: 'flex', flexDirection: 'column', overflow: 'hidden',
        }}>
          <div style={{ padding: '12px 16px', borderBottom: '1px solid #e2e8f0', background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1e293b', display: 'flex', alignItems: 'center', gap: 6 }}>
              <Icon.BarChart /> 节点详情
            </div>
            <span style={{ fontSize: 10, color: '#94a3b8', background: '#f1f5f9', padding: '2px 7px', borderRadius: 5 }}>L{selectedNode.level + 1}</span>
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '12px' }}>
            <NodeDetailPanel node={selectedNode} period={period} />
          </div>
        </div>
      </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
