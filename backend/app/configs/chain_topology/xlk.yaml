# XLK 产业链拓扑（前端图渲染配置）
# 来源: drilldown-upgrade.html L713-741 原型像素坐标 → 百分比空间
# 画布: VW=760, VH=350; 百分比 = 像素 / VW(VH) * 100
# 维护规则（CLAUDE.md §扩展性）：
#   - 新增板块只需新增 <sector>.yaml，不改 .py
#   - 节点 ID 必须与 node_taxonomy/<sector>.yaml 中的 node_id 一致
#   - 坐标 cx/cy/w/h 为画布百分比（0-100），前端 ×VW/100 / ×VH/100 还原像素
#   - role 须与前端 ROLE_COLORS 键名一致（sector/upstream/compute/memory/interconnect/platform/application/leaf）
#   - is_cross: 跨结构关系（非父子边），仅用于视觉区分（虚线+黄色）

sector: xlk

nodes:
  # ── 板块层 L0 ──
  - {node_id: XLK,          role: sector,       tier: 0, cx: 50.0, cy: 12.6, w: 16.1, h: 13.1, proxy: XLK,  proxy_type: primary,   proxy_label: 科技板块}
  # ── 主题层 L1 ──
  - {node_id: semi,         role: upstream,     tier: 1, cx: 19.7, cy: 37.7, w: 14.5, h: 12.6, proxy: SOXX, proxy_type: primary,   proxy_label: 半导体}
  - {node_id: soft,         role: platform,     tier: 1, cx: 50.7, cy: 37.7, w: 13.2, h: 12.6, proxy: IGV,  proxy_type: primary,   proxy_label: 软件}
  - {node_id: hw,           role: upstream,     tier: 1, cx: 80.8, cy: 37.7, w: 13.7, h: 12.6, proxy: HW,   proxy_type: synthetic, proxy_label: 硬件}
  # ── 细分层 L2 ──
  - {node_id: semi-equip,   role: upstream,     tier: 2, cx: 5.8,  cy: 62.3, w: 11.6, h: 11.4, proxy: SMH,  proxy_type: primary,   proxy_label: 设备}
  - {node_id: semi-compute, role: compute,      tier: 2, cx: 19.2, cy: 62.3, w: 11.6, h: 11.4, proxy: NVDA, proxy_type: synthetic, proxy_label: 计算}
  - {node_id: semi-mem,     role: memory,       tier: 2, cx: 32.6, cy: 62.3, w: 11.6, h: 11.4, proxy: DRAM, proxy_type: primary,   proxy_label: 存储}
  - {node_id: semi-conn,    role: interconnect, tier: 2, cx: 46.1, cy: 62.3, w: 11.6, h: 11.4, proxy: SIXG, proxy_type: primary,   proxy_label: 连接}
  - {node_id: soft-cloud,   role: platform,     tier: 2, cx: 61.3, cy: 62.3, w: 12.4, h: 11.4, proxy: SKYY, proxy_type: primary,   proxy_label: 云计算}
  - {node_id: soft-cyber,   role: application,  tier: 2, cx: 75.3, cy: 62.3, w: 12.4, h: 11.4, proxy: HACK, proxy_type: primary,   proxy_label: 网络安全}
  # ── 叶子层 L3 ──
  - {node_id: conn-optical, role: leaf,         tier: 3, cx: 38.9, cy: 86.9, w: 13.4, h: 11.4, proxy: CIEN, proxy_type: extension, proxy_label: 光互联}
  - {node_id: conn-copper,  role: leaf,         tier: 3, cx: 53.9, cy: 86.9, w: 12.1, h: 11.4, proxy: APH,  proxy_type: extension, proxy_label: 铜缆}

edges:
  # GICS 主干: XLK → 三个 L1 节点
  - {src: XLK,       dst: semi,         is_cross: false}
  - {src: XLK,       dst: soft,         is_cross: false}
  - {src: XLK,       dst: hw,           is_cross: false}

  # 半导体产业链
  - {src: semi,      dst: semi-equip,   is_cross: false}
  - {src: semi,      dst: semi-compute, is_cross: false}
  - {src: semi,      dst: semi-mem,     is_cross: false}
  - {src: semi,      dst: semi-conn,    is_cross: false}

  # 软件子节点（正常父子边，非跨链）
  - {src: soft,      dst: soft-cloud,   is_cross: false}
  - {src: soft,      dst: soft-cyber,   is_cross: false}

  # 连接叶子
  - {src: semi-conn, dst: conn-optical, is_cross: false}
  - {src: semi-conn, dst: conn-copper,  is_cross: false}

  # 跨视图: 硬件驱动连接（原型 L740 唯一跨链边）
  - {src: hw,        dst: semi-conn,    is_cross: true}
