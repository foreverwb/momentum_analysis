# Chain signal rules for XLK (Technology sector) — 产业链共振信号配置
#
# upstream:   上游节点分 > threshold 时触发「上游共振」
# broad:      同层节点中分 > threshold 的数量 >= min_count 时触发「同层扩散」
# downstream: 任一下游节点分 > threshold 时触发「下游确认」
#
# 节点 ID 对应 xlk.yaml 种子数据中的 node_id。
# 调整阈值或节点清单不需要改任何 .py 文件。

upstream:
  watched_nodes:
    - semi-equip         # 半导体设备：最上游，最先见顶放量
  threshold: 70

broad:
  watched_nodes:
    - semi-equip         # 设备
    - semi-compute       # 算力芯片
    - semi-mem           # 存储芯片
    - semi-conn          # 连接芯片
  threshold: 75
  min_count: 3           # ≥3 个节点超过阈值才算扩散

downstream:
  watched_nodes:
    - conn-optical       # 光互联（chain extension）
    - conn-copper        # 铜互联（chain extension）
  threshold: 75

# Task DD-4 — StrategicPanel（产业链下钻策略面板）配置
# l1_nodes:               Q1 排名候选（XLK 直系 L1 子节点）
# equip/conn/compute_node: Q3 上下游确认引用的三个节点 ID
# l2_drill_nodes:         Q4 best_drill 候选（按 delta5d 取最大）
strategy:
  l1_nodes:
    - semi
    - soft
    - hw
  equip_node: semi-equip
  conn_node: semi-conn
  compute_node: semi-compute
  l2_drill_nodes:
    - semi-equip
    - semi-compute
    - semi-mem
    - semi-conn
    - soft-cloud
    - soft-cyber
