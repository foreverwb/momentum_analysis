# IBKR连接配置
ibkr:
  host: '127.0.0.1'
  port: 4002  # Paper: 7497/4002, Live: 7496/4001
  client_id: 1
  timeout: 30

futu:
  host: '127.0.0.1'
  port: 11111
  market: 'US'

# 刷新冷却配置（分钟）
refresh:
  etf_cooldown_minutes: 15
  holdings_cooldown_minutes: 60
  serial_gap_seconds: 2

# CLI 文件查找配置
cli:
  downloads_dir: '~/Downloads'
  finviz_file_prefix: 'Finviz_'
  mc_file_prefix: 'MarketChameleon_'
  holdings_file_prefix: ''
